  <circle cx="100" cy="100" r="80" fill="url(#grad)" opacity="0.1"/>
  <text x="100" y="115" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#grad)" text-anchor="middle" filter="url(#shadow)">⚽</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">VFMC</text>
